[package]
name = "faultline_treasury"
version = "0.1.0"
description = "Minimal genuinely-upgradeable target for Faultline Milestone 1"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "faultline_treasury"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
v2 = []

[dependencies]
anchor-lang = "=0.30.1"
solana-program = "=1.18.10"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
